<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seed Teleoperator Save</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 40px; text-align: center; }
    button { padding: 14px 28px; font-size: 16px; font-weight: bold; background: #00d26a; border: none; border-radius: 8px; color: #000; cursor: pointer; }
    button:hover { background: #00ea76; }
    .box { background: #1c1c1f; max-width: 600px; margin: 0 auto; padding: 24px; border-radius: 12px; border: 1px solid #333; }
  </style>
</head>
<body>
  <div class="box">
    <h2>Pre-seed Teleoperator Progress</h2>
    <p>This will load the guest progress from <code>storage_snapshot.json</code> (Skips intro, unlocks Roadster and Cybercab, sets 750 cash and 1000 XP).</p>
    <button id="apply">Apply & Launch Game</button>
  </div>
  <script>
    document.getElementById('apply').onclick = async () => {
      try {
        const res = await fetch('/storage_snapshot.json');
        const data = await res.json();
        for (const [k, v] of Object.entries(data.local || {})) {
          localStorage.setItem(k, typeof v === 'string' ? v : JSON.stringify(v));
        }
        alert('Saved data applied! Redirecting to game...');
        window.location.href = '/';
      } catch (err) {
        alert('Error: ' + err.message);
      }
    };
  </script>
</body>
</html>
