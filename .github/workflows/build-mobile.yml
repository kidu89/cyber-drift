name: Build Mobile (iOS IPA & Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prepare web distribution & Sync iOS
        run: npm run sync:ios

      - name: Build Xcode Archive (Unsigned / Ad-Hoc Sideload)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ios/App/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r CyberDrift-SF-Overdrive.ipa Payload
          ls -lh CyberDrift-SF-Overdrive.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrift-SF-Overdrive-iOS-IPA
          path: CyberDrift-SF-Overdrive.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Prepare web distribution & Sync Android
        run: npm run sync:android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CyberDrift-SF-Overdrive.apk
          ls -lh CyberDrift-SF-Overdrive.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrift-SF-Overdrive-Android-APK
          path: CyberDrift-SF-Overdrive.apk
          retention-days: 14
