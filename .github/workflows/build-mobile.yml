name: Build Mobile (iOS IPA & Android APK)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare web distribution & Sync iOS
        run: npm run sync:ios

      - name: Build iOS Application (Release)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/App/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package & Sign IPA
        run: |
          APP_PATH=$(find ios/App/DerivedData -name "App.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name "*.framework" -type d -exec codesign --force --deep --sign - {} \; || true
          fi
          codesign --force --deep --sign - "$APP_PATH"
          codesign -vvv --deep --strict "$APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r CyberDrift-SF-Overdrive.ipa Payload
          ls -lh CyberDrift-SF-Overdrive.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrift-SF-Overdrive-iOS-IPA
          path: CyberDrift-SF-Overdrive.ipa
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web distribution & Sync Android
        run: npm run sync:android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CyberDrift-SF-Overdrive.apk
          ls -lh CyberDrift-SF-Overdrive.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberDrift-SF-Overdrive-Android-APK
          path: CyberDrift-SF-Overdrive.apk
          retention-days: 14
